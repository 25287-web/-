<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 게임 생성기</title>
    <!-- 화면 스타일링을 위한 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-900 text-white flex flex-col h-screen overflow-hidden">
    <!-- 상단 헤더 -->
    <header class="p-4 bg-gray-800 shadow-md border-b border-gray-700 flex-shrink-0">
        <h1 class="text-2xl font-bold text-center">🎮 AI 게임 메이커</h1>
    </header>

    <!-- 메인 레이아웃 (반응형: 모바일 세로, 데스크탑 가로) -->
    <main class="flex-1 flex flex-col md:flex-row p-4 gap-4 overflow-hidden">
        
        <!-- 왼쪽 패널: 프롬프트 입력 -->
        <section class="w-full md:w-1/3 flex flex-col gap-4">
            <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 flex-1 flex flex-col shadow-lg">
                <label for="prompt" class="block text-lg font-bold mb-3 text-gray-200">어떤 게임을 만들고 싶나요?</label>
                <textarea 
                    id="prompt" 
                    class="w-full flex-1 p-4 bg-gray-900 border border-gray-600 rounded-lg text-white resize-none focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 text-base" 
                    placeholder="예: 스페이스바를 누르면 네모가 점프해서 다가오는 장애물을 피하는 러닝 게임을 만들어줘. 배경은 검은색, 플레이어는 노란색으로 해줘."
                ></textarea>
                
                <button 
                    id="generate-btn" 
                    class="mt-4 w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 px-4 rounded-lg transition duration-200 flex justify-center items-center gap-2 text-lg shadow-md hover:shadow-blue-500/20"
                >
                    <span id="btn-text">게임 생성하기 🚀</span>
                </button>
                
                <p id="status-msg" class="text-sm text-blue-400 mt-4 text-center hidden animate-pulse font-medium">
                    AI가 코드를 작성하는 중입니다...<br><span class="text-gray-400 text-xs">(약 10~20초 소요)</span>
                </p>
            </div>
        </section>

        <!-- 오른쪽 패널: 게임 출력 화면 (iframe) -->
        <section class="w-full md:w-2/3 bg-gray-950 rounded-xl overflow-hidden flex items-center justify-center relative shadow-lg border border-gray-700">
            <iframe 
                id="game-frame" 
                class="w-full h-full border-0 bg-white" 
                sandbox="allow-scripts allow-same-origin"
            ></iframe>
            
            <!-- 초기 플레이스홀더 -->
            <div id="placeholder" class="absolute inset-0 flex flex-col items-center justify-center bg-gray-900 text-gray-500 pointer-events-none transition-opacity">
                <svg class="w-20 h-20 mb-4 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                <p class="text-lg font-medium">생성된 게임이 여기에 표시됩니다.</p>
            </div>
        </section>
        
    </main>

    <script>
        // 🚨 요청하신 API 키 하드코딩
        const API_KEY = "AQ.Ab8RN6LwGAjKbVDLeYfV3gcGitPxmJCLFaWGnKLH26f1czPRLA";

        document.addEventListener('DOMContentLoaded', () => {
            const generateBtn = document.getElementById('generate-btn');
            const btnText = document.getElementById('btn-text');
            const promptInput = document.getElementById('prompt');
            const gameFrame = document.getElementById('game-frame');
            const placeholder = document.getElementById('placeholder');
            const statusMsg = document.getElementById('status-msg');

            generateBtn.addEventListener('click', async () => {
                const userPrompt = promptInput.value.trim();
                if (!userPrompt) {
                    alert('만들고 싶은 게임을 설명해주세요!');
                    return;
                }

                // 1. UI 상태 변경 (로딩 중)
                generateBtn.disabled = true;
                generateBtn.classList.add('opacity-50', 'cursor-not-allowed');
                btnText.textContent = "생성 중...";
                statusMsg.classList.remove('hidden');
                placeholder.style.display = 'none';
                
                // 2. iframe 초기화 및 로딩 화면 표시
                const doc = gameFrame.contentWindow.document;
                doc.open();
                doc.write(`
                    <body style="background-color:#f3f4f6; display:flex; align-items:center; justify-content:center; height:100vh; margin:0;">
                        <div style="text-align:center;">
                            <div style="display:inline-block; width:40px; height:40px; border:4px solid #d1d5db; border-top-color:#3b82f6; border-radius:50%; animation:spin 1s linear infinite;"></div>
                            <h2 style="font-family:sans-serif; color:#4b5563; margin-top:16px;">AI가 게임을 제작하고 있습니다... ⏳</h2>
                            <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
                        </div>
                    </body>
                `);
                doc.close();

                try {
                    // 3. Gemini API 호출
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            contents: [{
                                parts: [{
                                    text: `너는 뛰어난 웹 게임 개발자야. 다음 요구사항에 맞는 간단한 웹 게임을 만들어줘.\n\n[요구사항]\n${userPrompt}\n\n[조건]\nHTML, CSS, JavaScript를 모두 합쳐서 단 1개의 완성된 HTML 파일 코드로 작성해. 대답이나 설명은 일절 하지 말고, 오직 마크다운 코드 블록(\`\`\`html ... \`\`\`) 안에 코드만 출력해. 외부 에셋은 절대 사용하지 말고 기본 도형으로만 렌더링해.`
                                }]
                            }]
                        })
                    });

                    if (!response.ok) {
                        throw new Error(`API 오류 발생 (상태 코드: ${response.status}). API 키가 유효하지 않거나 한도에 도달했을 수 있습니다.`);
                    }

                    const data = await response.json();
                    
                    if (!data.candidates || data.candidates.length === 0) {
                        throw new Error("AI가 응답을 생성하지 못했습니다.");
                    }

                    let generatedCode = data.candidates[0].content.parts[0].text;

                    // 4. 마크다운 기호 제거 (```html 및 ```)
                    generatedCode = generatedCode.replace(/^```html\n?/g, '').replace(/```\n?$/g, '');

                    // 5. iframe에 완성된 코드 작성
                    doc.open();
                    doc.write(generatedCode);
                    doc.close();

                } catch (error) {
                    console.error('Error:', error);
                    // 에러 발생 시 iframe에 붉은색 배경의 에러 메시지 표시
                    doc.open();
                    doc.write(`
                        <body style="background-color:#fee2e2; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; margin:0; padding:20px; text-align:center;">
                            <div style="font-family:sans-serif; color:#991b1b; max-width:80%;">
                                <h3 style="font-size:1.5rem; margin-bottom:10px; font-weight:bold;">오류가 발생했습니다 😢</h3>
                                <p style="line-height:1.5;">${error.message}</p>
                            </div>
                        </body>
                    `);
                    doc.close();
                } finally {
                    // 6. UI 상태 복구
                    generateBtn.disabled = false;
                    generateBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                    btnText.textContent = "게임 생성하기 🚀";
                    statusMsg.classList.add('hidden');
                }
            });
        });
    </script>
</body>
</html>
